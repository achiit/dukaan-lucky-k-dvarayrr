<style>
  #insta-floating-btn {
    position: fixed;
    bottom: 24px;
    right: 24px;
    width: 55px;
    height: 55px;
    border-radius: 50%;
    background: radial-gradient(circle at 30% 107%, #fdf497 0%, #fdf497 5%, #fd5949 45%, #d6249f 60%, #285AEB 90%);
    box-shadow: 0 6px 16px rgba(0, 0, 0, 0.25), 0 2px 6px rgba(0, 0, 0, 0.15);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 99999;
    cursor: grab;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
  }

  #insta-floating-btn:hover {
    transform: scale(1.08);
    box-shadow: 0 8px 20px rgba(0, 0, 0, 0.35);
  }

  #insta-floating-btn:active {
    cursor: grabbing;
    transform: scale(0.96);
  }

  #insta-floating-btn .insta-icon {
    width: 28px;
    height: 28px;
    fill: #ffffff;
    pointer-events: none;
  }
</style>

<script>
  (function() {
    const btn = document.getElementById('insta-floating-btn');
    const profileUrl = 'https://www.instagram.com/luckymaurya263/';
    
    let isDragging = false;
    let startX = 0, startY = 0;
    let initialLeft = 0, initialTop = 0;
    let dragThreshold = 5; // pixels moved to count as drag vs tap
    let moveDistance = 0;

    // Set initial layout position explicitly to avoid jumps on first drag
    function initPosition() {
      const rect = btn.getBoundingClientRect();
      btn.style.left = rect.left + 'px';
      btn.style.top = rect.top + 'px';
      btn.style.bottom = 'auto';
      btn.style.right = 'auto';
    }

    // Call after DOM is loaded
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initPosition);
    } else {
      initPosition();
    }

    btn.addEventListener('pointerdown', (e) => {
      isDragging = true;
      moveDistance = 0;
      startX = e.clientX;
      startY = e.clientY;
      
      const rect = btn.getBoundingClientRect();
      initialLeft = rect.left;
      initialTop = rect.top;

      btn.setPointerCapture(e.pointerId);
    });

    btn.addEventListener('pointermove', (e) => {
      if (!isDragging) return;

      const dx = e.clientX - startX;
      const dy = e.clientY - startY;
      moveDistance = Math.hypot(dx, dy);

      let newLeft = initialLeft + dx;
      let newTop = initialTop + dy;

      // Keep inside visible screen bounds
      const maxLeft = window.innerWidth - btn.offsetWidth;
      const maxTop = window.innerHeight - btn.offsetHeight;

      newLeft = Math.max(0, Math.min(newLeft, maxLeft));
      newTop = Math.max(0, Math.min(newTop, maxTop));

      btn.style.left = newLeft + 'px';
      btn.style.top = newTop + 'px';
    });

    function endDrag(e) {
      if (!isDragging) return;
      isDragging = false;
      btn.releasePointerCapture(e.pointerId);

      // Open profile only if pointer moved less than threshold (tap/click)
      if (moveDistance < dragThreshold) {
        window.open(profileUrl, '_blank', 'noopener,noreferrer');
      }
    }

    btn.addEventListener('pointerup', endDrag);
    btn.addEventListener('pointercancel', endDrag);

    // Ensure button remains on screen on resize
    window.addEventListener('resize', () => {
      const rect = btn.getBoundingClientRect();
      const maxLeft = window.innerWidth - btn.offsetWidth;
      const maxTop = window.innerHeight - btn.offsetHeight;

      if (rect.left > maxLeft) btn.style.left = Math.max(0, maxLeft) + 'px';
      if (rect.top > maxTop) btn.style.top = Math.max(0, maxTop) + 'px';
    });
  })();
</script>
<!-- Floating Instagram Button End -->
